name: Odoo 19 validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
      - name: Check out reviewed Odoo 19 source
        run: |
          git init /tmp/odoo
          git -C /tmp/odoo remote add origin https://github.com/odoo/odoo.git
          git -C /tmp/odoo fetch --depth=1 origin c2c11a3c5287f9683e68e9e6d77457f27ef7f4b4
          git -C /tmp/odoo checkout FETCH_HEAD
      - name: Install Python dependencies
        run: |
          python -m pip install -r /tmp/odoo/requirements.txt
          python -m pip install tinycss2
      - name: Static contracts and assets
        run: python scripts/validate_module.py --odoo-source /tmp/odoo
      - name: Clean install and native HTTP/cart tests
        run: |
          python /tmp/odoo/odoo-bin -d ydd_test --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo_test_only --addons-path=/tmp/odoo/addons,$GITHUB_WORKSPACE -i ydd_pharmacy_website --without-demo=True --test-enable --test-tags=/ydd_pharmacy_website --stop-after-init --http-port=8069 --log-level=test --logfile=/tmp/ydd-install.log
      - name: Prepare merchant edits for upgrade check
        run: |
          YDD_UPGRADE_PHASE=before python /tmp/odoo/odoo-bin shell -d ydd_test --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo_test_only --addons-path=/tmp/odoo/addons,$GITHUB_WORKSPACE --no-http < scripts/check_upgrade.py
      - name: Upgrade without resetting content
        run: |
          python /tmp/odoo/odoo-bin -d ydd_test --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo_test_only --addons-path=/tmp/odoo/addons,$GITHUB_WORKSPACE -u ydd_pharmacy_website --without-demo=True --stop-after-init --logfile=/tmp/ydd-upgrade.log
      - name: Verify merchant edits survive upgrade
        run: |
          YDD_UPGRADE_PHASE=after python /tmp/odoo/odoo-bin shell -d ydd_test --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo_test_only --addons-path=/tmp/odoo/addons,$GITHUB_WORKSPACE --no-http < scripts/check_upgrade.py
      - name: Print Odoo diagnostics on failure
        if: failure()
        run: tail -n 250 /tmp/ydd-*.log || true
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydd-odoo-test-logs
          path: /tmp/ydd-*.log
